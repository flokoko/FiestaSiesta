<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Fiesta Siesta">
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FBD867"/>
      <stop offset="45%" stop-color="#EF8B3C"/>
      <stop offset="100%" stop-color="#B31F1C"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#186158"/>
      <stop offset="100%" stop-color="#0A3833"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#FFF3CF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFF3CF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- Sonne -->
    <circle cx="238" cy="204" r="168" fill="url(#glow)"/>
    <circle cx="238" cy="204" r="106" fill="#FFF3CF"/>

    <!-- Meer -->
    <path d="M0 392 C76 372 138 396 214 390 C300 383 366 362 442 374 C472 379 494 386 512 382 L512 512 L0 512 Z" fill="url(#sea)"/>

    <!-- Insel (spanisches Gelb) -->
    <path d="M296 392 C306 348 336 330 372 330 C410 330 440 348 452 392 Z" fill="#F1BF00"/>

    <!-- Palme -->
    <g fill="none" stroke="#0A3833" stroke-width="17" stroke-linecap="round">
      <path d="M374 336 C371 300 368 274 365 252"/>
      <path d="M365 252 C338 236 306 240 286 260"/>
      <path d="M365 252 C344 222 318 206 292 202"/>
      <path d="M365 252 C392 224 420 218 444 232"/>
      <path d="M365 252 C392 260 418 274 430 294"/>
    </g>
  </g>
</svg>
