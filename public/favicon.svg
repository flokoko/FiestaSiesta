<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Fiesta Siesta">
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#22456F"/>
      <stop offset="55%" stop-color="#152C4C"/>
      <stop offset="100%" stop-color="#0A1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F2A03B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F2A03B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FDF2D6"/>
      <stop offset="60%" stop-color="#F0D89F"/>
      <stop offset="100%" stop-color="#D8B97C"/>
    </linearGradient>
    <linearGradient id="vino" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#F2634C"/>
      <stop offset="45%" stop-color="#B3241D"/>
      <stop offset="100%" stop-color="#750F0E"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Stiel + Fuß -->
    <rect x="246" y="360" width="20" height="72" rx="10" fill="#FDF2D6"/>
    <ellipse cx="256" cy="442" rx="64" ry="18" fill="#FDF2D6"/>

    <!-- Glas + Sangria -->
    <path d="M174 172 L338 172 L322 300 C318 342 296 360 256 360 C216 360 194 342 190 300 Z" fill="#FFF6E0" opacity="0.16"/>
    <path d="M186 210 L326 210 L314 298 C311 334 292 350 256 350 C220 350 201 334 198 298 Z" fill="url(#vino)"/>
    <ellipse cx="256" cy="210" rx="70" ry="15" fill="#F2715B"/>
    <ellipse cx="232" cy="208" rx="24" ry="7" fill="#FF8A72" opacity="0.55"/>
    <!-- Frucht -->
    <circle cx="286" cy="252" r="25" fill="#F2A03B"/>
    <circle cx="286" cy="252" r="17" fill="#FBCB74"/>
    <g stroke="#F2A03B" stroke-width="3">
      <line x1="286" y1="235" x2="286" y2="269"/>
      <line x1="269" y1="252" x2="303" y2="252"/>
    </g>
    <circle cx="222" cy="300" r="16" fill="#7CB342"/>
    <circle cx="222" cy="300" r="9" fill="#C6E39B"/>
    <path d="M174 172 L338 172 L322 300 C318 342 296 360 256 360 C216 360 194 342 190 300 Z" fill="none" stroke="#FDF2D6" stroke-width="10" stroke-linejoin="round"/>

    <!-- Sombrero über dem Glasrand -->
    <g transform="rotate(-20 248 174)">
      <ellipse cx="248" cy="174" rx="150" ry="44" fill="url(#straw)"/>
      <ellipse cx="248" cy="174" rx="150" ry="44" fill="none" stroke="#8A6A38" stroke-width="6"/>
      <path d="M198 174 C198 118 214 94 248 94 C282 94 298 118 298 174 Z" fill="#FBEECB"/>
      <path d="M200 150 C220 160 276 160 296 150 L296 172 C276 182 220 182 200 172 Z" fill="#B3241D"/>
    </g>
  </g>
</svg>
