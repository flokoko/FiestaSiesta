<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/FiestaSiesta/favicon.svg" />
    <link rel="apple-touch-icon" href="/FiestaSiesta/apple-touch-icon.png" />
    <link rel="manifest" href="/FiestaSiesta/manifest.json" />
    <!-- Ohne Preload wird die Schrift erst nach CSS-Parse entdeckt (~1 RTT später sichtbar) -->
    <link rel="preload" href="/FiestaSiesta/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#F8F6F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F0D12" />
    <script>
      // Theme VOR dem ersten Paint setzen: sonst startet die App immer hell und
      // springt dann auf Dunkel (die statische Splash-Fläche hing nur an
      // prefers-color-scheme, nicht an der gespeicherten Wahl).
      (function () {
        try {
          var m = localStorage.getItem('theme') || 'auto'
          var d = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]:not([media])')
          if (meta) meta.setAttribute('content', d ? '#0F0D12' : '#F8F6F4')
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Urlaubs-App für Gran Canaria — gemeinsam planen, packen, abrechnen." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fiesta Siesta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fiesta Siesta</title>
  </head>
  <body>
    <div id="root">
      <!-- Statischer Platzhalter bis React übernimmt: gleiches Markup wie
           BootSplash in App.tsx, damit beim Start kein weißer Blitz und kein
           Login-Aufblitzen zu sehen ist. -->
      <div class="boot-splash" role="status" aria-label="Fiesta Siesta wird geladen">
        <span class="boot-flag"><span></span><span></span><span></span></span>
        <span class="boot-name">Fiesta Siesta</span>
      </div>
    </div>
    <style>
      .boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(70% 42% at 50% 6%, rgba(241,191,0,.30), transparent 72%),
          radial-gradient(120% 55% at 50% 104%, rgba(200,96,84,.16), transparent 68%),
          linear-gradient(180deg, #FDF6E8 0%, #FBEDE1 52%, #F5DFD8 100%); }
      .boot-flag { display: flex; flex-direction: column; width: 74px; height: 50px;
        border-radius: 10px; overflow: hidden; box-shadow: 0 10px 26px rgba(170,21,27,.22); }
      .boot-flag > span:nth-child(1), .boot-flag > span:nth-child(3) { flex: 1; background: #AA151B; }
      .boot-flag > span:nth-child(2) { flex: 2; background: #F1BF00; }
      .boot-name { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600;
        letter-spacing: .02em; color: #6E6874; }
      @media (prefers-color-scheme: dark) {
        .boot-splash { background: linear-gradient(180deg, #17131A 0%, #1D1519 55%, #241619 100%); }
        .boot-name { color: #9A93AB; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
